# Configuración de Siege para pruebas de carga del Proyecto Casalai CA
# Copiar a /etc/siege/siege.conf o usar con --file=parámetro

# Configuración general
verbose = true
quiet = false
show-logfile = false
logging = true
protocol = HTTP/1.1
chunked = true
connection = close
concurrent = 25
internet = false
benchmark = false
user-agent = "Mozilla/5.0 (Siege Load Tester)"
spinner = true

# Timeouts ajustados para OCR (puede tardar hasta 5s)
timeout = 10
delay = 0
failures = 1024

# Configuración de archivos
file = urls_login.txt
logfile = resultados_siege.log
csv = false
fullurl = true

# Headers
header = Accept: application/json
header = Content-Type: application/json

# Sin proxy por defecto (ajustar si es necesario)
# proxy = http://proxy.example.com:8080
